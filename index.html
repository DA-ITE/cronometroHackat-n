<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackatón Docente 2026 · Cronómetro</title>
<style>
:root{
  --navy:#082B52;
  --navy-2:#103E70;
  --cyan:#14B8D4;
  --red:#F5224E;
  --bg:#F5F8FB;
  --panel:#FFFFFF;
  --text:#152335;
  --muted:#6E7F91;
  --line:#DCE5ED;
  --soft:#EDF3F7;
  --success:#1E9B68;
  --warn:#E09500;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text)
}
button{font:inherit}
.app{
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  transition:grid-template-columns .3s ease
}
.app.menu-collapsed{grid-template-columns:minmax(0,1fr) 0}

/* ÁREA PRINCIPAL */
.stage{
  position:relative;
  min-width:0;
  height:100%;
  display:grid;
  grid-template-rows:64px minmax(0,1fr) 78px;
  background:
    radial-gradient(circle at 15% 15%,rgba(20,184,212,.08),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(245,34,78,.07),transparent 28%),
    linear-gradient(180deg,#FAFCFE 0%,#F4F8FB 100%);
}
.topbar{
  padding:10px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  border-bottom:1px solid rgba(220,229,237,.85);
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(16px)
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;color:white;font-weight:900;
  background:linear-gradient(135deg,var(--red),var(--cyan))
}
.brand-title{font-weight:900;color:var(--navy);font-size:16px;line-height:1.05}
.brand-sub{font-size:11px;color:var(--muted);margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:42px;height:42px;border:1px solid var(--line);border-radius:13px;
  background:#fff;color:var(--navy);display:grid;place-items:center;
  cursor:pointer;font-size:18px;font-weight:900
}

/* CONTENIDO - AJUSTADO PARA QUE SIEMPRE QUEPA */
.main{
  min-height:0;
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:hidden;
  padding:clamp(24px,3.8vh,42px) 28px 8px
}
.content{
  width:min(1180px,100%);
  height:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  min-height:0
}
.eyebrow{
  display:inline-flex;align-self:center;align-items:center;gap:9px;
  font-size:11px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--red)
}
.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.title{
  margin:8px auto 4px;
  max-width:1120px;
  font-size:clamp(32px,5vh,54px);
  line-height:1.02;
  letter-spacing:-.035em;
  color:var(--navy);
  font-weight:950
}
.time-range{
  font-size:clamp(15px,2.5vh,21px);
  color:var(--muted);
  font-weight:700
}
.timer{
  flex:1 1 auto;
  min-height:0;
  margin:clamp(26px,4vh,48px) 0 0;
  font-size:clamp(250px,min(44vw,50vh),540px);
  line-height:.70;
  font-weight:950;
  letter-spacing:-.08em;
  font-variant-numeric:tabular-nums;
  color:var(--navy);
  text-align:center;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center
}
.timer.warn{color:var(--warn)}
.timer.danger{color:var(--red)}
.progress-wrap{display:none}
.progress{
  height:10px;border-radius:999px;background:#E4EBF1;overflow:hidden
}
.progress-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--red),var(--cyan),var(--navy));
  transition:width .3s ease
}
/* CONTROLES SIEMPRE VISIBLES */
.controls-bar{
  min-height:78px;
  padding:10px 18px 14px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(248,251,253,.72);
  backdrop-filter:blur(18px);
  z-index:10
}
.controls-pill{
  display:flex;
  align-items:center;
  gap:4px;
  padding:6px;
  border:1px solid rgba(220,229,237,.95);
  border-radius:999px;
  background:rgba(255,255,255,.96);
  box-shadow:0 10px 32px rgba(8,43,82,.10)
}
.ctrl{
  min-width:0;
  min-height:44px;
  border-radius:999px;
  border:0;
  background:transparent;
  color:var(--navy);
  font-weight:850;
  cursor:pointer;
  padding:0 18px;
  transition:background .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease
}
.ctrl:hover:not(:disabled){background:#F1F5F8;transform:translateY(-1px)}
.ctrl.primary{
  background:var(--navy);
  color:white;
  box-shadow:0 6px 16px rgba(8,43,82,.18)
}
.ctrl.primary:hover:not(:disabled){background:#0B3765}
.ctrl.red{background:transparent;color:var(--red)}
.ctrl.red:hover:not(:disabled){background:#FFF1F5}
.ctrl:disabled{opacity:.28;cursor:not-allowed}

/* MENÚ LATERAL */
.sidebar{
  width:360px;
  min-width:0;
  overflow:hidden;
  height:100%;
  background:#fff;
  border-left:1px solid var(--line);
  box-shadow:-14px 0 40px rgba(8,43,82,.05);
  transition:opacity .25s ease,transform .3s ease
}
.app.menu-collapsed .sidebar{
  opacity:0;transform:translateX(30px);pointer-events:none
}
.side-inner{height:100%;display:flex;flex-direction:column}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.side-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.side-head h2{margin:0;color:var(--navy);font-size:19px}
.side-head p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.4}
.close-menu{
  width:38px;height:38px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:var(--navy);
  cursor:pointer;font-size:18px
}
.schedule{
  flex:1;overflow:auto;
  padding:12px 12px 16px;
  display:grid;
  gap:7px
}
.item{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:10px 11px;
  text-align:left;
  cursor:pointer;
  display:grid;
  grid-template-columns:72px 1fr;
  gap:10px;
  transition:.18s ease
}
.item:hover{border-color:#B8CBD9;background:#FBFDFE}
.item.active{
  border-color:var(--cyan);
  background:#F0FBFD;
  box-shadow:inset 4px 0 0 var(--cyan)
}
.item-time{font-size:10px;line-height:1.25;font-weight:900;color:var(--red)}
.item-title{font-size:12px;line-height:1.22;font-weight:900;color:var(--navy)}
.item-owner{font-size:9px;color:var(--muted);margin-top:3px}

.pitch-groups{
  display:grid;
  gap:6px;
  margin:-1px 0 4px 14px;
  padding:2px 0 2px 11px;
  border-left:2px solid #E7EEF3;
}
.pitch-group{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  background:#FAFCFE;
  color:var(--navy);
  padding:8px 10px;
  text-align:left;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  transition:.18s ease;
}
.pitch-group:hover{border-color:#B8CBD9;background:#F5FAFD}
.pitch-group.active{
  border-color:var(--cyan);
  background:#F0FBFD;
  box-shadow:inset 3px 0 0 var(--cyan);
}
.pitch-group-name{font-size:11px;font-weight:900}
.pitch-group-time{font-size:9px;color:var(--muted);font-weight:700;white-space:nowrap}

/* AJUSTE ESPECIAL PARA PANTALLAS BAJAS */
@media(max-height:820px){
  .stage{grid-template-rows:58px minmax(0,1fr) 72px}
  .topbar{padding:8px 20px}
  .brand-mark{width:36px;height:36px}
  .icon-btn{width:38px;height:38px}
  .main{padding:20px 24px 6px}
  .title{font-size:clamp(28px,4.6vh,42px);margin-top:7px}
  .time-range{font-size:15px}
  .timer{font-size:clamp(215px,min(41vw,45vh),390px);margin:clamp(22px,3vh,38px) 0 0}
  .controls-bar{min-height:72px;padding:8px 14px 10px}
  .ctrl{min-height:42px;padding:0 16px}
}
@media(max-height:700px){
  .brand-sub{display:none}
  .eyebrow{font-size:10px}
  .main{padding-top:14px}
  .title{font-size:clamp(26px,4.2vh,36px)}
  .timer{font-size:clamp(190px,min(39vw,42vh),320px);margin:20px 0 0}
}

@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:absolute;right:0;top:0;bottom:0;z-index:30;
    width:min(88vw,360px);
    transform:translateX(0)
  }
  .app.menu-collapsed .sidebar{transform:translateX(100%)}
}
@media(max-width:640px){
  .stage{grid-template-rows:58px minmax(0,1fr) auto}
  .topbar{padding:8px 12px}
  .brand-sub{display:none}
  .main{padding:18px 12px 8px}
  .title{font-size:28px}
  .timer{font-size:clamp(165px,min(52vw,36vh),260px);margin-top:24px}
  .controls-bar{padding:9px 8px 11px}
  .controls-pill{width:100%;justify-content:center;border-radius:18px;flex-wrap:wrap}
  .ctrl{min-height:42px;padding:0 12px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app">
  <section class="stage">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <div class="brand-title">Hackatón Docente 2026</div>
          <div class="brand-sub">Cronómetro de jornada · 4 de noviembre</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="fullscreenBtn" class="icon-btn" type="button" title="Pantalla completa">⛶</button>
        <button id="menuBtn" class="icon-btn" type="button" title="Mostrar u ocultar menú">☰</button>
      </div>
    </header>

    <main class="main">
      <div class="content">
        <div class="eyebrow">Momento actual</div>
        <h1 id="title" class="title"></h1>
        <div id="timeRange" class="time-range"></div>

        <div id="timer" class="timer">20:00</div>
<div class="progress-wrap">
          <div class="progress">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

      </div>
    </main>

    <footer class="controls-bar">
      <div class="controls-pill" aria-label="Controles del cronómetro">
        <button id="prevBtn" class="ctrl" type="button">← Anterior</button>
        <button id="playBtn" class="ctrl primary" type="button">▶ Iniciar</button>
        <button id="resetBtn" class="ctrl red" type="button">↻ Reiniciar</button>
        <button id="nextBtn" class="ctrl" type="button">Siguiente →</button>
      </div>
    </footer>
  </section>

  <aside class="sidebar">
    <div class="side-inner">
      <div class="side-head">
        <div class="side-head-row">
          <div>
            <h2>Momentos del evento</h2>
            <p>Selecciona cualquier bloque para cargar su cronómetro.</p>
          </div>
          <button id="closeMenuBtn" class="close-menu" type="button">×</button>
        </div>
      </div>
      <div id="schedule" class="schedule"></div>
    </div>
  </aside>
</div>

<script>
(()=>{
  const moments=[
    {start:'08:00',end:'08:20',title:'Recepción, registro y snack de bienvenida',owner:'Equipo organizador'},
    {start:'08:20',end:'08:30',title:'Bienvenida e inauguración',owner:'Equipo organizador'},
    {start:'08:30',end:'08:50',title:'Presentación del reto, metodología, reglas y formación de equipos',owner:'Moderador'},
    {start:'08:50',end:'09:20',title:'Descubrimiento del problema',owner:'Equipos'},
    {start:'09:20',end:'10:20',title:'Diseño del MVP',owner:'Equipos'},
    {start:'10:20',end:'11:20',title:'Desarrollo y prototipado del MVP',owner:'Equipos'},
    {start:'11:20',end:'11:50',title:'Validación rápida + preparación del pitch',owner:'Equipos'},
    {start:'11:50',end:'12:05',title:'Coffee break',owner:'Equipo organizador'},
    {start:'12:05',end:'13:25',title:'Pitch final y demostración del MVP',owner:'Equipo organizador'},
    {start:'13:25',end:'13:45',title:'Deliberación del jurado',owner:'Jurado'},
    {start:'13:45',end:'14:00',title:'Premiación y cierre',owner:'Equipo organizador'}
  ];

  const $=id=>document.getElementById(id);
  const app=$('app');
  let current=0;
  let remaining=0;
  let running=false;
  let lastTick=Date.now();

  const PITCH_INDEX=8;
  const PITCH_GROUPS=10;
  let pitchMode=false;
  let pitchGroup=0;
  let pitchPhase='presentation'; // presentation | jury

  /* El bloque general de Pitch mantiene su propio cronómetro,
     independiente de los cronómetros de cada grupo. */
  let pitchBlockRemaining=duration(moments[PITCH_INDEX]);
  let pitchBlockRunning=false;
  let pitchBlockLastTick=Date.now();

  function toMinutes(t){
    const [h,m]=t.split(':').map(Number);
    return h*60+m;
  }

  function duration(moment){
    return (toMinutes(moment.end)-toMinutes(moment.start))*60;
  }

  function formatClock(sec){
    sec=Math.max(0,Math.round(sec));
    const h=Math.floor(sec/3600);
    const m=Math.floor((sec%3600)/60);
    const s=sec%60;
    if(h>0){
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function formatTime(t){
    const [h,m]=t.split(':').map(Number);
    const suffix=h>=12?'p. m.':'a. m.';
    const hh=((h+11)%12)+1;
    return `${hh}:${String(m).padStart(2,'0')} ${suffix}`;
  }

  function buildMenu(){
    const wrap=$('schedule');
    wrap.innerHTML='';

    moments.forEach((m,i)=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='item';
      b.dataset.momentIndex=i;
      b.innerHTML=`
        <div class="item-time">${formatTime(m.start)}<br>${formatTime(m.end)}</div>
        <div>
          <div class="item-title">${m.title}</div>
          <div class="item-owner">${m.owner}</div>
        </div>`;

      b.addEventListener('click',()=>{
        selectMoment(i);
        if(window.innerWidth<980){
          app.classList.add('menu-collapsed');
        }
      });

      wrap.appendChild(b);

      if(i===PITCH_INDEX){
        const groups=document.createElement('div');
        groups.className='pitch-groups';

        for(let g=0;g<PITCH_GROUPS;g++){
          const gb=document.createElement('button');
          gb.type='button';
          gb.className='pitch-group';
          gb.dataset.pitchGroup=g;
          gb.innerHTML=`
            <span class="pitch-group-name">Grupo ${g+1}</span>
            <span class="pitch-group-time">4 min + 3 min</span>`;
          gb.addEventListener('click',()=>{
            selectPitchGroup(g);
            if(window.innerWidth<980){
              app.classList.add('menu-collapsed');
            }
          });
          groups.appendChild(gb);
        }

        wrap.appendChild(groups);
      }
    });
  }

  function selectMoment(i){
    pitchMode=false;
    current=Math.max(0,Math.min(moments.length-1,i));

    if(current===PITCH_INDEX){
      remaining=pitchBlockRemaining;
      running=pitchBlockRunning;
    }else{
      remaining=duration(moments[current]);
      running=false;
    }

    lastTick=Date.now();
    render();
  }

  function selectPitchGroup(i){
    /* Si venimos del bloque general, conservar exactamente su estado. */
    if(current===PITCH_INDEX && !pitchMode){
      pitchBlockRemaining=remaining;
      pitchBlockRunning=running;
      pitchBlockLastTick=Date.now();
    }

    pitchMode=true;
    current=PITCH_INDEX;
    pitchGroup=Math.max(0,Math.min(PITCH_GROUPS-1,i));
    pitchPhase='presentation';
    remaining=4*60;
    running=false;
    lastTick=Date.now();
    render();
  }

  function resetPitchPhase(){
    remaining=(pitchPhase==='presentation'?4:3)*60;
    running=false;
    lastTick=Date.now();
    render();
  }

  function nextPitchGroup(){
    if(pitchGroup<PITCH_GROUPS-1){
      selectPitchGroup(pitchGroup+1);
    }else{
      selectMoment(PITCH_INDEX+1);
    }
  }

  function prevPitchGroup(){
    if(pitchGroup>0){
      selectPitchGroup(pitchGroup-1);
    }else{
      selectMoment(PITCH_INDEX-1);
    }
  }

  function render(){
    const m=moments[current];
    const total=pitchMode
      ? (pitchPhase==='presentation'?4*60:3*60)
      : duration(m);
    const elapsed=Math.max(0,total-remaining);
    const progress=total?Math.min(100,(elapsed/total)*100):0;

    if(pitchMode){
      $('title').textContent=`Grupo ${pitchGroup+1} · ${pitchPhase==='presentation'?'Presentación':'Preguntas del jurado'}`;
      $('timeRange').textContent=pitchPhase==='presentation'?'4 minutos':'3 minutos';
    }else{
      $('title').textContent=m.title;
      $('timeRange').textContent=`${formatTime(m.start)} – ${formatTime(m.end)}`;
    }

    $('timer').textContent=formatClock(remaining);
    $('progressFill').style.width=progress+'%';

    const timer=$('timer');
    timer.className='timer';

    if(remaining<=60){
      timer.classList.add('danger');
    }else if(remaining<=300){
      timer.classList.add('warn');
    }

    $('playBtn').textContent=running?'❚❚ Pausar':'▶ Iniciar';

    if(pitchMode){
      $('prevBtn').disabled=false;
      $('nextBtn').disabled=false;
    }else{
      $('prevBtn').disabled=current===0;
      $('nextBtn').disabled=current===moments.length-1;
    }

    [...$('schedule').children].forEach(el=>{
      if(el.classList.contains('item')){
        el.classList.toggle('active',Number(el.dataset.momentIndex)===current && !pitchMode);
      }
    });

    document.querySelectorAll('.pitch-group').forEach((el,i)=>{
      el.classList.toggle('active',pitchMode && i===pitchGroup);
    });
  }

  function tick(){
    const now=Date.now();

    /* Cronómetro general del bloque Pitch: continúa aunque esté oculto. */
    if(pitchBlockRunning){
      pitchBlockRemaining-=(now-pitchBlockLastTick)/1000;
      pitchBlockLastTick=now;

      if(pitchBlockRemaining<=0){
        pitchBlockRemaining=0;
        pitchBlockRunning=false;
      }
    }else{
      pitchBlockLastTick=now;
    }

    /* Cuando estamos viendo el bloque general de Pitch, reflejar su estado real. */
    if(!pitchMode && current===PITCH_INDEX){
      remaining=pitchBlockRemaining;
      running=pitchBlockRunning;
      lastTick=now;
      render();
      return;
    }

    if(!running){
      render();
      return;
    }

    remaining-=(now-lastTick)/1000;
    lastTick=now;

    if(remaining<=0){
      if(pitchMode && pitchPhase==='presentation'){
        pitchPhase='jury';
        remaining=3*60;
        running=true;
        lastTick=Date.now();
      }else{
        remaining=0;
        running=false;
      }
    }

    render();
  }

  $('playBtn').addEventListener('click',()=>{
    if(pitchMode){
      if(remaining<=0){
        remaining=(pitchPhase==='presentation'?4:3)*60;
      }
      running=!running;
      lastTick=Date.now();
    }else if(current===PITCH_INDEX){
      if(pitchBlockRemaining<=0){
        pitchBlockRemaining=duration(moments[PITCH_INDEX]);
      }
      pitchBlockRunning=!pitchBlockRunning;
      pitchBlockLastTick=Date.now();
      remaining=pitchBlockRemaining;
      running=pitchBlockRunning;
      lastTick=Date.now();
    }else{
      if(remaining<=0){
        remaining=duration(moments[current]);
      }
      running=!running;
      lastTick=Date.now();
    }

    render();
  });

  $('resetBtn').addEventListener('click',()=>{
    if(pitchMode){
      resetPitchPhase();
    }else if(current===PITCH_INDEX){
      pitchBlockRemaining=duration(moments[PITCH_INDEX]);
      pitchBlockRunning=false;
      pitchBlockLastTick=Date.now();
      remaining=pitchBlockRemaining;
      running=false;
      lastTick=Date.now();
      render();
    }else{
      selectMoment(current);
    }
  });

  $('prevBtn').addEventListener('click',()=>{
    if(pitchMode) prevPitchGroup();
    else selectMoment(current-1);
  });

  $('nextBtn').addEventListener('click',()=>{
    if(pitchMode) nextPitchGroup();
    else selectMoment(current+1);
  });

  $('menuBtn').addEventListener('click',()=>{
    app.classList.toggle('menu-collapsed');
  });

  $('closeMenuBtn').addEventListener('click',()=>{
    app.classList.add('menu-collapsed');
  });

  $('fullscreenBtn').addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }else{
        await document.exitFullscreen();
      }
    }catch(e){}
  });

  buildMenu();
  selectMoment(0);
  setInterval(tick,250);
})();
</script>
</body>
</html>
